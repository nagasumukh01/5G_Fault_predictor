services:
  - type: web
    name: fiveg-fault-backend
    runtime: python
    buildCommand: pip install -r requirements.txt && python scripts/train_and_eval.py
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        sync: false
